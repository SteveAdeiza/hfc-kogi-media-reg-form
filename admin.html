<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HFC Media - Admin Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background: #f1f5f9;
      padding: 20px;
    }
    
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    
    .login-box {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    
    .login-box h2 {
      color: #1a365d;
      margin-bottom: 20px;
      font-size: 22px;
    }
    
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 15px;
      font-family: 'Inter', sans-serif;
    }
    
    .login-box input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    
    .login-box button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    
    .login-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    
    .error-msg {
      color: #dc2626;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
    
    .dashboard {
      display: none;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      background: #fff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    h1 {
      color: #1a365d;
      font-size: 24px;
      font-weight: 700;
    }
    
    .count {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }
    
    .logout-btn {
      padding: 10px 18px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .logout-btn:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }
    
    .table-wrapper {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }
    
    th {
      background: #f8fafc;
      padding: 16px;
      text-align: left;
      font-weight: 600;
      color: #334155;
      font-size: 13px;
      text-transform: uppercase;
      border-bottom: 2px solid #e2e8f0;
    }
    
    td {
      padding: 16px;
      border-bottom: 1px solid #e2e8f0;
      color: #475569;
      font-size: 14px;
    }
    
    tr:hover {
      background: #f8fafc;
    }
    
    .passport-img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      object-fit: cover;
    }
    
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .skill-tag {
      background: #e0e7ff;
      color: #4338ca;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    
    .error {
      color: #dc2626;
    }
    
    @media (max-width: 768px) {
      body { padding: 15px; }
      .header { flex-direction: column; gap: 15px; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h2>Admin Access</h2>
      <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off">
      <button onclick="checkPassword()">Login</button>
      <div class="error-msg" id="errorMsg">Wrong password. Try again.</div>
    </div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="container">
      <div class="header">
        <div class="header-left">
          <h1>HFC Kogi Zone Media - Registrations</h1>
          <div class="count" id="count">Loading...</div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
      
      <div class="table-wrapper">
        <div id="content">
          <div class="loading">Loading registrations...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // CHANGE THIS PASSWORD
    const ADMIN_PASSWORD = "hfckogimedia";
    
    window.checkPassword = function() {
      const input = document.getElementById('passwordInput').value;
      const errorMsg = document.getElementById('errorMsg');
      
      if (input === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('passwordInput').value = '';
      }
    }
    
    window.logout = function() {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('passwordInput').value = '';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('content').innerHTML = '<div class="loading">Loading registrations...</div>';
    }
    
    document.getElementById('passwordInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        checkPassword();
      }
    });
    
    import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js';
    
    const SUPABASE_URL = 'https://tmmpwrbmwjppmskgdrup.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtbXB3cmJtd2pwcG1za2dkcnVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzEwNjEsImV4cCI6MjA5NjYwNzA2MX0.DmRrusdBCtCKt5EqjqYYxunZg0udycIlN-PSK8xTPUI';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    async function loadData() {
      try {
        const { data, error, count } = await supabase
          .from('members')
          .select('*', { count: 'exact' })
          .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        document.getElementById('count').textContent = `${count || 0} Registrations`;
        
        if (!data || data.length === 0) {
          document.getElementById('content').innerHTML = '<div class="loading">No registrations yet</div>';
          return;
        }
        
        const table = `
          <table>
            <thead>
              <tr>
                <th>Passport</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Branch</th>
                <th>Position</th>
                <th>Skills</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              ${data.map(row => `
                <tr>
                  <td>${row.passport_url ? `<img src="${row.passport_url}" class="passport-img">` : '-'}</td>
                  <td><strong>${row.full_name}</strong></td>
                  <td>${row.phone}</td>
                  <td>${row.email}</td>
                  <td>${row.church_branch}</td>
                  <td>${row.position}</td>
                  <td>
                    <div class="skills">
                      ${row.skills ? row.skills.map(s => `<span class="skill-tag">${s}</span>`).join('') : '-'}
                    </div>
                  </td>
                  <td>${new Date(row.created_at).toLocaleDateString()}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        
        document.getElementById('content').innerHTML = table;
        
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
